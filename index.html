<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Patient Waiting System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div class="container mx-auto p-4 md:p-8 max-w-5xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-blue-700 mb-2"><i class="fas fa-hospital-user mr-2"></i>City Hospital</h1>
            <p class="text-gray-600 text-lg">Patient Waiting Management System (Queue Implementation)</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Left Column: Add Patient and Current Call -->
            <div class="md:col-span-1 space-y-6">
                
                <!-- Call Next Patient -->
                <div class="bg-white rounded-lg shadow-md p-6 border-t-4 border-green-500">
                    <h2 class="text-xl font-semibold mb-4 text-gray-800">Doctor's Desk</h2>
                    <div id="currentPatient" class="bg-gray-50 p-4 rounded border text-center mb-4 min-h-[100px] flex flex-col justify-center">
                        <p class="text-gray-500 italic">No patient is currently being seen.</p>
                    </div>
                    <button id="btnCallNext" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded transition duration-200 shadow flex justify-center items-center">
                        <i class="fas fa-bullhorn mr-2"></i> Call Next Patient (Dequeue)
                    </button>
                </div>

                <!-- Add Patient Form -->
                <div class="bg-white rounded-lg shadow-md p-6 border-t-4 border-blue-500">
                    <h2 class="text-xl font-semibold mb-4 text-gray-800">New Patient Registration</h2>
                    <form id="addPatientForm" class="space-y-4">
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="patientName">
                                Patient Name
                            </label>
                            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:border-blue-500" id="patientName" type="text" placeholder="John Doe" required>
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="medicalIssue">
                                Medical Issue / Department
                            </label>
                            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:border-blue-500" id="medicalIssue" type="text" placeholder="e.g., General Checkup, Orthopedics" required>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-200">
                            <i class="fas fa-plus-circle mr-2"></i> Register Patient (Enqueue)
                        </button>
                    </form>
                </div>

            </div>

            <!-- Right Column: Queue Display -->
            <div class="md:col-span-2">
                <div class="bg-white rounded-lg shadow-md p-6 border-t-4 border-purple-500 h-full">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-semibold text-gray-800">Waiting Queue</h2>
                        <span id="queueCount" class="bg-purple-100 text-purple-800 text-xs font-medium px-2.5 py-0.5 rounded-full">0 patients waiting</span>
                    </div>
                    
                    <div class="bg-gray-50 rounded-md border p-2 h-[500px] overflow-y-auto">
                        <ul id="queueList" class="space-y-3">
                            <!-- Queue items will be injected here -->
                            <li class="text-center text-gray-500 italic mt-10">Queue is currently empty.</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        Notification message
    </div>

    <script src="script.js"></script>
</body>
</html>
